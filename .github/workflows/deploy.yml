name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push replaces a queued one.
concurrency:
  group: deploy-pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Node, pnpm, Rust (with the wasm32 target), wasm-pack and wasm-opt, as pinned in mise.toml.
      - uses: jdx/mise-action@v2
        with:
          cache: true

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Check the host headers are in the build
        run: test -f apps/web/dist/_headers && grep -q "Cross-Origin-Embedder-Policy" apps/web/dist/_headers

      # Wrangler runs through `pnpm dlx`, so it isn't added to the workspace's dependencies.
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'open-paint' }}
        run: >-
          pnpm dlx wrangler@4 pages deploy apps/web/dist
          --project-name="$PROJECT" --branch=main
          --commit-hash="$GITHUB_SHA" --commit-message="$(git log -1 --format=%s)"
